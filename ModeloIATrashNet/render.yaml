services:
  - type: web
    name: trashia-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: MODEL_PATH
        value: models/TrashIAv2.h5
      - key: ALLOWED_ORIGINS
        value: "*" 
    healthCheckPath: /health
